<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ameya Kohli — Ameya's Library</title>
  <meta name="description" content="The portfolio of Ameya Kohli: fine art, graphic design, animation, research, and the things on the bottom shelf.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#2a211b">

  <!-- Social cards. og:image must be an absolute URL once deployed; update the domain if it changes. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ameya's Library">
  <meta property="og:description" content="The portfolio of Ameya Kohli: fine art, graphic design, animation, research, and the things on the bottom shelf.">
  <meta property="og:image" content="https://ameyakohli.com/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:url" content="https://ameyakohli.com/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Ameya's Library">
  <meta name="twitter:description" content="The portfolio of Ameya Kohli.">
  <meta name="twitter:image" content="https://ameyakohli.com/og.jpg">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">

  <!-- The painting is the whole site: fetch it first. -->
  <link rel="preload" as="image" href="library.webp" type="image/webp" media="(min-width: 768px)" fetchpriority="high">

  <!-- Fonts: preconnect, swap, only the weights used. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Spectral:ital,wght@0,300;0,400;1,300&family=Alegreya+Sans:wght@400;500&family=Silkscreen&family=VT323&family=Caveat:wght@500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1 class="visually-hidden">Ameya Kohli, portfolio</h1>

  <main id="room" class="room">
    <!-- The painting IS the interface. The wrapper below has the painting's
         exact aspect ratio so percentage hotspots stay locked to the art.
         Its inline background is a 32px blurred placeholder that the full
         image crossfades over (see styles.css, step 9). -->
    <div id="stage" class="stage" style="--painting-w: 3840; --painting-h: 2160; background-image: url('data:image/webp;base64,UklGRmQAAABXRUJQVlA4IFgAAADwAwCdASogABIAPtFepE0oJaOosBgIARAaCWUAsOwVRJCbedS3x1UAAP7uV/G8K+eDpa+FLO46KBF62bI1T5+18r5gizk+V31E25gY8Vj61/PqotJ/hAAA');">
      <div class="stage-inner">
        <div id="layer-base" class="layer layer-base">
          <picture>
            <source srcset="library-2400.webp" media="(max-width: 767px)" type="image/webp">
            <source srcset="library.webp" type="image/webp">
            <img id="painting" class="painting" src="library-2400.png" width="3840" height="2160" fetchpriority="high" decoding="async"
                 alt="A warm, lamplit room. A girl in a pale blouse stands at the left reading a book, her long hair falling over one shoulder. Behind her a stepped wooden bookshelf climbs toward the ceiling, with a monitor and a desk at the right. The words Ameya's Library are painted across the wall above the shelves.">
          </picture>
        </div>
        <div id="layer-sharp" class="layer layer-sharp" aria-hidden="true">
          <picture>
            <source srcset="library-2400.webp" media="(max-width: 767px)" type="image/webp">
            <source srcset="library.webp" type="image/webp">
            <img class="painting" src="library-2400.png" width="3840" height="2160" alt="" decoding="async">
          </picture>
        </div>
        <!-- Atmosphere: vignette and the cursor lamp. CSS only. Delete to cut. -->
        <div class="atmosphere" aria-hidden="true">
          <!-- Cursor lamp: a warm pool that follows the pointer anywhere on the painting. JS in app.js. -->
          <div class="cursor-lamp"></div>
          <div class="vignette"></div>
          <!-- Time of day: a faint tint set from the visitor's clock (see app.js). -->
          <div class="daylight"></div>
          <!-- Shadow sweep: once, when a panel opens, as if the lifted object crossed the lamp. -->
          <div class="shadow-sweep"></div>
        </div>
        <!-- Dust motes in the lamplight. CSS only. Delete this div to cut them. -->
        <div class="motes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <nav id="hotspots" class="hotspots" aria-label="Sections of the library"></nav>
      </div>
    </div>

    <!-- Under 768px the hotspots are too small to use. The painting stays
         at the top and the sections become a list of book spines. -->
    <nav id="spines" class="spines" aria-label="Sections of the library"></nav>
  </main>

  <!-- Step 4: the section panel. Taking something off the shelf. -->
  <div id="scrim" class="scrim" hidden></div>
  <aside id="panel" class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" aria-hidden="true" tabindex="-1">
    <button type="button" id="panel-close" class="panel-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
        <path d="M4.5 4.5 L19.5 19.5 M19.5 4.5 L4.5 19.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="panel-scroll">
      <header class="panel-head">
        <h2 id="panel-title" class="panel-title"></h2>
        <p id="panel-intro" class="panel-intro"></p>
      </header>
      <div id="panel-items" class="panel-items"></div>
    </div>
  </aside>

  <noscript>
    <section class="noscript">
      <p>This site is an interactive painting and needs JavaScript to open the shelves. Here is what is on them:</p>
      <h2>About me</h2>
      <p>I'm Ameya. I paint, design, animate, and poke at research questions. This library is where I keep the things I've made.</p>
      <h2>Fine art</h2>
      <p>Paintings and drawings, mostly digital, some not.</p>
      <h2>Graphic design</h2>
      <p>Posters, layouts, identities. Things meant to be printed.</p>
      <h2>Animation</h2>
      <p>Moving pictures. Short loops and longer pieces.</p>
      <h2>Research</h2>
      <p>Questions I've chased, with the people I chased them with.</p>
      <h2>Interests</h2>
      <p>The books on the bottom shelf. Things I like that aren't work.</p>
      <h2>Websites</h2>
      <p>Three sites I built.</p>
      <h2>Contact</h2>
      <p>Email ameyakohli0 at gmail dot com.</p>
    </section>
  </noscript>

  <footer class="footer">© 2026 Ameya Kohli. All artwork my own.</footer>

  <!-- Plain scripts, in order. config.js declares SECTIONS; app.js reads it. -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
